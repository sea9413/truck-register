<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>装货登记</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #333; font-size: 15px; }
.container { max-width: 600px; margin: 0 auto; padding: 0 0 80px; }

.header { background: #1a7af8; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 18px; font-weight: 600; }
.header .count { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; font-size: 13px; }

.list-page { padding: 16px; }
.add-btn { display: block; width: 100%; background: #1a7af8; color: white; border: none; border-radius: 12px; padding: 16px; font-size: 17px; font-weight: 600; cursor: pointer; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(26,122,248,0.3); }
.add-btn:disabled { background: #ccc; }
.record-card { background: white; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.15s; }
.record-card:active { transform: scale(0.98); }
.record-card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.record-card .date { font-size: 13px; color: #888; }
.record-card .plate { font-size: 16px; font-weight: 600; color: #222; }
.record-card .bottom { display: flex; gap: 10px; font-size: 13px; color: #666; }
.record-card .goods-tag { background: #e8f0ff; color: #1a7af8; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.empty { text-align: center; padding: 60px 20px; color: #aaa; font-size: 15px; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }

.detail-page { padding: 0; display: none; }
.detail-header { background: white; padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px; }
.back-btn { background: none; border: none; font-size: 15px; color: #1a7af8; cursor: pointer; padding: 4px 0; }
.detail-items { padding: 16px 20px; }
.detail-item { display: flex; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
.detail-item:last-child { border-bottom: none; }
.detail-item .label { color: #888; width: 90px; flex-shrink: 0; }
.detail-item .value { color: #222; word-break: break-all; }
.detail-item .value.highlight { color: #1a7af8; font-weight: 600; }
.copy-notice-btn { display: block; width: calc(100% - 40px); margin: 16px 20px; background: #f0f7ff; color: #1a7af8; border: 1px solid #cce0ff; border-radius: 10px; padding: 12px; font-size: 14px; cursor: pointer; text-align: center; }

.form-page { padding: 0; display: none; }
.form-header { background: white; padding: 14px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px; }
.form-section { background: white; margin: 12px; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.section-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.section-title .tag { background: #1a7af8; color: white; font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: normal; }

.paste-area { width: 100%; min-height: 120px; border: 2px dashed #ccc; border-radius: 10px; padding: 12px; font-size: 14px; color: #555; resize: none; outline: none; background: #fafafa; transition: border-color 0.2s; line-height: 1.6; }
.paste-area:focus { border-color: #1a7af8; background: white; }
.paste-area::placeholder { color: #bbb; }

.recognize-btn { display: block; width: 100%; background: #ff9500; color: white; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 12px; }
.recognize-btn:active { background: #e08600; }
.recognize-btn:disabled { background: #ccc; cursor: not-allowed; }

.recognize-result { background: #f0f9e8; border: 1px solid #c0e0a0; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #444; margin-top: 10px; line-height: 1.8; word-break: break-all; }
.recognize-result .unfilled { color: #ff6600; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
.form-group input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; font-size: 15px; outline: none; transition: border-color 0.2s; background: #fafafa; }
.form-group input:focus { border-color: #1a7af8; background: white; }
.form-group input:read-only { background: #f5f5f5; color: #888; border-color: #e0e0e0; }

.goods-btns { display: flex; gap: 8px; }
.goods-btn { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 14px; cursor: pointer; text-align: center; transition: all 0.15s; color: #666; }
.goods-btn.active { background: #1a7af8; color: white; border-color: #1a7af8; font-weight: 600; }

.other-input-wrap { display: none; margin-top: 8px; }
.other-input-wrap.show { display: block; }
.other-input-wrap input { border-color: #ff9500; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.submit-btn { display: block; width: calc(100% - 24px); margin: 16px 12px; background: #1a7af8; color: white; border: none; border-radius: 12px; padding: 16px; font-size: 17px; font-weight: 600; cursor: pointer; }
.submit-btn:active { background: #1565d0; }
.submit-btn:disabled { background: #ccc; cursor: not-allowed; }

.toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }
.toast.green { background: #27ae60; }
.toast.red { background: #e74c3c; }

.loading { text-align: center; padding: 40px; color: #aaa; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.record-card { animation: slideDown 0.2s ease; }

.sync-status { font-size: 12px; color: rgba(255,255,255,0.8); margin-left: 8px; }
</style>
</head>
<body>

<div class="container">
  <div class="list-page" id="listPage">
    <div class="header">
      <h1>🚛 装货登记</h1>
      <span class="count" id="recordCount">加载中…</span>
    </div>
    <button class="add-btn" id="addBtn" onclick="showForm()">+ 新增登记</button>
    <div id="recordList"><div class="loading">连接数据库…</div></div>
  </div>

  <div class="detail-page" id="detailPage">
    <div class="detail-header">
      <button class="back-btn" onclick="showList()">← 返回</button>
      <span style="font-weight:600">记录详情</span>
    </div>
    <div class="detail-items" id="detailItems"></div>
    <button class="copy-notice-btn" id="detailCopyBtn" onclick="copyDetailNotice()">📋 复制通知文字</button>
  </div>

  <div class="form-page" id="formPage">
    <div class="form-header">
      <button class="back-btn" onclick="showList()">← 返回</button>
      <span style="font-weight:600">新增登记</span>
    </div>

    <div class="form-section">
      <div class="section-title">📋 粘贴识别区 <span class="tag">自动填入</span></div>
      <textarea class="paste-area" id="pasteArea" placeholder="把司机发来的信息整段粘贴到这里…" oninput="checkPaste()"></textarea>
      <button class="recognize-btn" id="recognizeBtn" onclick="doRecognize()" disabled>🔍 识别</button>
      <div class="recognize-result" id="recognizeResult" style="display:none"></div>
    </div>

    <div class="form-section">
      <div class="section-title">📝 核对与补填</div>

      <div class="form-group">
        <label>日期</label>
        <input type="date" id="fDate">
      </div>

      <div class="two-col">
        <div class="form-group">
          <label>主车车牌 *</label>
          <input type="text" id="fPlateMain" placeholder="如：粤K53163">
        </div>
        <div class="form-group">
          <label>挂车车牌</label>
          <input type="text" id="fPlateTrailer" placeholder="如：粤KH639挂">
        </div>
      </div>

      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="fName" placeholder="司机姓名">
      </div>

      <div class="two-col">
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" id="fPhone" placeholder="手机号">
        </div>
        <div class="form-group">
          <label>身份证号</label>
          <input type="text" id="fIdCard" placeholder="自动填入" readonly>
        </div>
      </div>

      <div class="form-group">
        <label>装货地</label>
        <input type="text" id="fFrom" placeholder="从哪里装货">
      </div>

      <div class="form-group">
        <label>收货地</label>
        <input type="text" id="fTo" placeholder="送到哪里">
      </div>

      <div class="form-group">
        <label>货物</label>
        <div class="goods-btns">
          <div class="goods-btn" onclick="selectGoods(this, '盘扣')">盘扣</div>
          <div class="goods-btn" onclick="selectGoods(this, '套扣')">套扣</div>
          <div class="goods-btn" onclick="selectGoods(this, '其他')">其他</div>
        </div>
        <div class="other-input-wrap" id="otherWrap">
          <input type="text" id="fGoodsOther" placeholder="请输入货物名称">
        </div>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label>运费（元）</label>
          <input type="number" id="fFreight" placeholder="如：1700">
        </div>
        <div class="form-group">
          <label>过磅重量（公斤）</label>
          <input type="number" id="fWeight" placeholder="如：20000">
        </div>
      </div>

      <div class="form-group" style="margin-bottom:0">
        <label>过磅费（元）</label>
        <input type="number" id="fWeighFee" placeholder="如：50">
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="doSubmit()">提 交</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Supabase 配置
const SUPABASE_URL = 'https://gdyiottosunwjothghaz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OMPVS-R2K3r9o8vx0VCx1A_SAd4iomg';
const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentRecords = [];
let currentDetail = null;
let selectedGoods = '';

// 页面切换
function showList() {
  document.getElementById('listPage').style.display = 'block';
  document.getElementById('detailPage').style.display = 'none';
  document.getElementById('formPage').style.display = 'none';
  loadRecords();
}
function showDetail() {
  document.getElementById('listPage').style.display = 'none';
  document.getElementById('detailPage').style.display = 'block';
  document.getElementById('formPage').style.display = 'none';
}
function showForm() {
  document.getElementById('listPage').style.display = 'none';
  document.getElementById('detailPage').style.display = 'none';
  document.getElementById('formPage').style.display = 'block';
  resetForm();
}

function resetForm() {
  document.getElementById('pasteArea').value = '';
  document.getElementById('recognizeResult').style.display = 'none';
  document.getElementById('recognizeBtn').disabled = true;
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('fDate').value = today;
  ['fPlateMain','fPlateTrailer','fName','fPhone','fIdCard','fFrom','fTo','fFreight','fWeight','fWeighFee'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fIdCard').readOnly = true;
  document.querySelectorAll('.goods-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('otherWrap').classList.remove('show');
  document.getElementById('fGoodsOther').value = '';
  selectedGoods = '';
}

function checkPaste() {
  const text = document.getElementById('pasteArea').value.trim();
  document.getElementById('recognizeBtn').disabled = text.length < 5;
}

// 智能识别
function recognize(rawText) {
  const text = rawText.replace(/\r\n/g, '\n').trim();
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  let result = { date: formatDate(new Date()), plateMain: '', plateTrailer: '', name: '', phone: '', idCard: '', from: '', to: '', goods: '', goodsRaw: '', freight: '' };

  // 日期
  for (const line of lines) {
    const m = line.match(/^(\d{1,2})[月\-\.](\d{1,2})/);
    if (m) { const y = new Date().getFullYear(); result.date = `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; break; }
    const m2 = line.match(/^(\d{4})[年\-\.](\d{1,2})[月\-\.](\d{1,2})/);
    if (m2) { result.date = `${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`; break; }
  }

  const allText = text;

  // 身份证号（优先带标签）
  const idWithLabel = allText.match(/身份证[：:\s]*([1-9]\d{5}(?:\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dx]|[3][01]\d{14}[\dx]))/i);
  if (idWithLabel) result.idCard = idWithLabel[1].toUpperCase();
  else { const idAll = allText.match(/([1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dx])/i); if (idAll) result.idCard = idAll[1].toUpperCase(); }

  // 手机号（优先带标签）
  const phoneWithLabel = allText.match(/电话[：:\s]*(\d{11})/);
  if (phoneWithLabel) result.phone = phoneWithLabel[1];
  else { const phoneAll = allText.match(/(?:^|[^\d])(\d{11})(?=[^\d]|$)/); if (phoneAll) result.phone = phoneAll[1]; }

  // 姓名
  const nameWithLabel = allText.match(/姓名[：:\s]*([\u4e00-\u9fa5]{2,4})/);
  if (nameWithLabel) result.name = nameWithLabel[1];
  else { const nameLine = lines.find(l => /^[\u4e00-\u9fa5]{2,4}$/.test(l) && l.length >= 2 && l.length <= 4); if (nameLine) result.name = nameLine; }

  // 货物
  for (const line of lines) { if (line.includes('盘扣')) { result.goods = '盘扣'; break; } if (line.includes('套扣')) { result.goods = '套扣'; break; } if (/^其他[\s\d\u4e00-\u9fa5]/.test(line)) { result.goods = line.replace(/^其他/, '').trim(); result.goodsRaw = '其他'; break; } }
  if (!result.goods) { const goodsLine = lines.find(l => l.includes('盘扣') || l.includes('套扣')); if (goodsLine) { if (goodsLine.includes('盘扣')) result.goods = '盘扣'; else if (goodsLine.includes('套扣')) result.goods = '套扣'; } }

  // 运费
  const freightWithLabel = allText.match(/运费[：:\s]*(\d+)/);
  if (freightWithLabel) result.freight = freightWithLabel[1];
  else { const freightNear = allText.match(/运费[\u4e00-\u9fa5]*(\d+)/); if (freightNear) result.freight = freightNear[1]; }

  // 车牌
  const plateCombo = allText.match(/车牌[：:\s]*([\u4e00-\u9fa5·][A-Z][A-Z0-9]{5,6})\s*\+\s*([\u4e00-\u9fa5·][A-Z][A-Z0-9]{4,6}挂)/);
  if (plateCombo) { result.plateMain = plateCombo[1]; result.plateTrailer = plateCombo[2]; }
  else {
    const platePattern = /[\u4e00-\u9fa5·]([A-Z])[A-Z0-9]{4,6}(?:挂)?(?=[^\u4e00-\u9fa5·]|$)/g;
    let plates = [], match;
    while ((match = platePattern.exec(allText)) !== null) { let p = match[0]; if (!['平板车','牵引车','挂车车牌'].includes(p.replace(/^[\u4e00-\u9fa5·]/,''))) plates.push(p); }
    if (plates.length === 0) { const rawPlates = allText.match(/(?:^|[\s，,])([京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉贵粤青藏川宁琼台港奥][A-Z][A-Z0-9]{4,6}(?:挂)?)(?:[\s，,]|$)/g); if (rawPlates) for (const rp of rawPlates) { const p = rp.replace(/^[\s，,]+/, '').replace(/[\s，,]+$/, '').trim(); if (p && p.length >= 6 && p.length <= 10) plates.push(p); } }
    if (plates.length >= 1) { const main = plates.filter(p => !p.endsWith('挂')); const trailer = plates.filter(p => p.endsWith('挂')); result.plateMain = main[0] || plates[0]; if (trailer.length > 0) result.plateTrailer = trailer[0]; else if (plates.length >= 2) result.plateTrailer = plates[1]; }
  }

  // 地址
  const singleLine = lines.find(l => /退回|送至|→/.test(l));
  if (singleLine) { const parts = singleLine.split(/退回|送至|→/).map(s => s.trim()); if (parts.length >= 2) { result.from = parts[0]; result.to = parts[1]; } else if (parts.length === 1) result.to = parts[0]; }
  if (!result.from || !result.to) { for (const line of lines) { if (/退回|送至|→/.test(line) && line.length > 3 && line.length < 50) { const parts = line.split(/退回|送至|→/).map(s => s.trim()); if (!result.from && parts[0]) result.from = parts[0]; if (!result.to && parts[1]) result.to = parts[1]; if (result.from && result.to) break; } } }
  if (!result.from || !result.to) { const fullLine = allText.match(/([\u4e00-\u9fa5]{2,20})(?:退回|送至|→)([\u4e00-\u9fa5]{2,20})/); if (fullLine) { result.from = result.from || fullLine[1]; result.to = result.to || fullLine[2]; } }

  return result;
}

function doRecognize() {
  const text = document.getElementById('pasteArea').value;
  if (!text.trim()) return;
  const r = recognize(text);
  document.getElementById('fDate').value = r.date;
  document.getElementById('fPlateMain').value = r.plateMain;
  document.getElementById('fPlateTrailer').value = r.plateTrailer;
  document.getElementById('fName').value = r.name;
  document.getElementById('fPhone').value = r.phone;
  document.getElementById('fIdCard').value = r.idCard;
  document.getElementById('fFrom').value = r.from;
  document.getElementById('fTo').value = r.to;
  document.getElementById('fFreight').value = r.freight;
  document.querySelectorAll('.goods-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('otherWrap').classList.remove('show');
  selectedGoods = '';
  if (r.goods === '盘扣' || r.goods === '套扣') { document.querySelectorAll('.goods-btn').forEach(b => { if (b.textContent.trim() === r.goods) b.classList.add('active'); }); selectedGoods = r.goods; }
  else if (r.goods && r.goods !== '其他') { selectedGoods = r.goodsRaw || '其他'; document.querySelectorAll('.goods-btn').forEach(b => { if (b.textContent.trim() === '其他') b.classList.add('active'); }); document.getElementById('otherWrap').classList.add('show'); document.getElementById('fGoodsOther').value = r.goods; }
  const resultEl = document.getElementById('recognizeResult');
  const unfilled = [], filled = [];
  const push = (label, val) => val ? filled.push(`${label} ${val}`) : unfilled.push(`${label}`);
  push('日期', r.date); push('主车', r.plateMain); push('挂车', r.plateTrailer); push('姓名', r.name); push('手机', r.phone); push('身份证', r.idCard); push('运费', r.freight ? r.freight + '元' : ''); push('装货地', r.from); push('收货地', r.to); push('货物', r.goods);
  resultEl.innerHTML = `<strong>已识别：</strong>${filled.join(' | ')}${unfilled.length ? `<br><span class="unfilled">未识别：${unfilled.join('、')}（请手动填写）</span>` : ''}`;
  resultEl.style.display = 'block';
  toast('识别完成，请核对后提交', true);
}

function selectGoods(el, type) {
  document.querySelectorAll('.goods-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedGoods = type;
  const wrap = document.getElementById('otherWrap');
  if (type === '其他') { wrap.classList.add('show'); document.getElementById('fGoodsOther').focus(); }
  else { wrap.classList.remove('show'); document.getElementById('fGoodsOther').value = ''; }
}

async function doSubmit() {
  const plate = document.getElementById('fPlateMain').value.trim();
  const from = document.getElementById('fFrom').value.trim();
  if (!plate) { toast('请填写主车车牌'); return; }
  const goodsDisplay = selectedGoods === '其他' ? (document.getElementById('fGoodsOther').value.trim() || '其他') : (selectedGoods || '待填');
  const record = {
    date: document.getElementById('fDate').value || formatDate(new Date()),
    plate_main: plate,
    plate_trailer: document.getElementById('fPlateTrailer').value.trim(),
    name: document.getElementById('fName').value.trim(),
    phone: document.getElementById('fPhone').value.trim(),
    id_card: document.getElementById('fIdCard').value.trim(),
    from_location: from,
    to_location: document.getElementById('fTo').value.trim(),
    goods: goodsDisplay,
    freight: document.getElementById('fFreight').value.trim(),
    weight: document.getElementById('fWeight').value.trim(),
    weigh_fee: document.getElementById('fWeighFee').value.trim(),
    notice: generateNotice({ date: document.getElementById('fDate').value, plateMain: plate, plateTrailer: document.getElementById('fPlateTrailer').value.trim(), name: document.getElementById('fName').value.trim(), phone: document.getElementById('fPhone').value.trim(), idCard: document.getElementById('fIdCard').value.trim(), from: from, to: document.getElementById('fTo').value.trim(), goods: goodsDisplay, freight: document.getElementById('fFreight').value.trim(), weight: document.getElementById('fWeight').value.trim(), weighFee: document.getElementById('fWeighFee').value.trim() })
  };
  const { error } = await supabaseClient.from('records').insert([record]);
  if (error) { toast('提交失败：' + error.message, false, true); return; }
  toast('已登记 ✓', true);
  setTimeout(() => { loadRecords(); showList(); }, 600);
}

function generateNotice(r) {
  const plateStr = r.plateTrailer ? `${r.plateMain}+${r.plateTrailer}` : r.plateMain;
  const nameStr = r.name ? ` | 姓名：${r.name}` : '';
  const phoneStr = r.phone ? ` | 手机：${r.phone}` : '';
  const weightStr = r.weight ? `${r.weight}公斤` : '待填';
  const feeStr = r.weighFee ? `${r.weighFee}元` : '待填';
  const route = r.from && r.to ? `装：${r.from} → 收：${r.to}` : (r.from ? `装货地：${r.from}` : (r.to ? `收货地：${r.to}` : ''));
  return `🚛 已登记 | ${r.date} | 车牌：${plateStr}${nameStr}${phoneStr} | ${route} | 货物：${r.goods} | 运费：${r.freight}元 | 过磅：${weightStr} | 过磅费：${feeStr}`;
}

async function loadRecords() {
  const { data, error } = await supabaseClient.from('records').select('*').order('created_at', { ascending: false });
  if (error) { document.getElementById('recordList').innerHTML = '<div class="empty">连接失败，请刷新</div>'; return; }
  currentRecords = data || [];
  renderList();
}

function renderList() {
  document.getElementById('recordCount').textContent = currentRecords.length + ' 条';
  const el = document.getElementById('recordList');
  if (currentRecords.length === 0) { el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>还没有登记记录<br>点上方按钮开始</div>'; return; }
  el.innerHTML = currentRecords.map(r => {
    const plate = r.plate_trailer ? `${r.plate_main}+${r.plate_trailer}` : r.plate_main;
    const goods = r.goods || '待填';
    return `<div class="record-card" onclick="showRecordDetail('${r.id}')">
      <div class="top"><span class="date">${r.date || ''}</span><span class="plate">${plate}</span></div>
      <div class="bottom">
        <span class="goods-tag">${goods}</span>
        ${r.from_location ? `<span>装：${r.from_location}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function showRecordDetail(id) {
  const r = currentRecords.find(x => x.id === id);
  if (!r) return;
  currentDetail = r;
  const plate = r.plate_trailer ? `${r.plate_main}+${r.plate_trailer}` : r.plate_main;
  const fields = [
    ['日期', r.date, true], ['主车车牌', r.plate_main, true], ['挂车车牌', r.plate_trailer || '—'],
    ['姓名', r.name || '未填'], ['手机号', r.phone || '未填'], ['身份证号', r.id_card || '未填'],
    ['装货地', r.from_location || '未填'], ['收货地', r.to_location || '未填'], ['货物', r.goods || '未填'],
    ['运费', r.freight ? r.freight + ' 元' : '未填'], ['过磅重量', r.weight ? r.weight + ' 公斤' : '待填'], ['过磅费', r.weigh_fee ? r.weigh_fee + ' 元' : '待填']
  ];
  document.getElementById('detailItems').innerHTML = fields.map(([label, val, highlight]) => `<div class="detail-item"><span class="label">${label}</span><span class="value${highlight ? ' highlight' : ''}">${val}</span></div>`).join('');
  showDetail();
}

function copyDetailNotice() {
  if (!currentDetail) return;
  const text = currentDetail.notice || generateNotice({ date: currentDetail.date, plateMain: currentDetail.plate_main, plateTrailer: currentDetail.plate_trailer, name: currentDetail.name, phone: currentDetail.phone, idCard: currentDetail.id_card, from: currentDetail.from_location, to: currentDetail.to_location, goods: currentDetail.goods, freight: currentDetail.freight, weight: currentDetail.weight, weighFee: currentDetail.weigh_fee });
  copyText(text);
}

function copyText(text) {
  if (navigator.clipboard) { navigator.clipboard.writeText(text).then(() => toast('已复制，去微信群粘贴发送', true)); }
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('已复制，去微信群粘贴发送', true); }
}

function formatDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function toast(msg, green, red) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (green ? ' green' : '') + (red ? ' red' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 初始化加载
loadRecords();
</script>
</body>
</html>
