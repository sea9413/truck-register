<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>装货登记</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #333; font-size: 15px; }
.container { max-width: 600px; margin: 0 auto; padding: 0 0 90px; }

.header { background: #1a7af8; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 18px; font-weight: 600; }
.header .count { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; font-size: 13px; }

.list-page { padding: 16px; }
.add-btn { display: block; width: 100%; background: #1a7af8; color: white; border: none; border-radius: 12px; padding: 16px; font-size: 17px; font-weight: 600; cursor: pointer; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(26,122,248,0.3); }
.add-btn:disabled { background: #ccc; }
.record-card { background: white; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.15s; }
.record-card:active { transform: scale(0.98); }
.record-card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.record-card .date { font-size: 13px; color: #888; }
.record-card .plate { font-size: 16px; font-weight: 600; }
.record-card .bottom { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: #666; }
    .record-card .fee-line { font-size: 13px; color: #333; margin: 4px 0; font-weight: 500; }
.record-card .goods-tag { background: #e8f0ff; color: #1a7af8; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.record-card .badge-pending { background: #fff3e0; color: #e65100; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.record-card .badge-modified { background: #ffebee; color: #c62828; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.summary-bar { background: #e8f5e9; color: #2e7d32; padding: 10px 16px; margin: 0 16px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; text-align: center; }
.filter-bar { margin: 0 16px 12px; background: white; border-radius: 10px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.filter-row:last-child { margin-bottom: 0; }
.filter-bar input[type=date], .filter-bar input[type=text] { flex: 1; min-width: 0; border: 1px solid #ddd; border-radius: 8px; padding: 8px; font-size: 14px; }
.filter-sep { color: #888; font-size: 13px; }
.filter-bar button { border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.filter-btn-reset { background: #f0f0f0; color: #666; }
.filter-btn-export { background: #1a7af8; color: white; }
.filter-btn-import { background: #ff9800; color: white; }
.filter-btn-template { background: #f0f0f0; color: #666; }
.location-selector { display: flex; background: #f0f0f0; border-radius: 8px; overflow: hidden; }
.loc-btn { border: none; background: none; padding: 7px 12px; font-size: 13px; cursor: pointer; color: #666; border-radius: 0; font-weight: 600; }
.loc-btn.active { background: #1a7af8; color: white; }
.record-card .is_paid-check { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: #666; }
.record-card .is_paid-check input { width: 16px; height: 16px; cursor: pointer; }
.empty { text-align: center; padding: 60px 20px; color: #aaa; font-size: 15px; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.month-group { margin-bottom: 4px; }
.month-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: #f5f5f5; border-radius: 8px; cursor: pointer; font-size: 14px; color: #444; user-select: none; }
.month-header:hover { background: #eee; }
.month-toggle { font-size: 12px; color: #888; transition: transform 0.2s; }
.month-header.collapsed .month-toggle { transform: rotate(-90deg); }
.month-count { font-size: 12px; color: #888; }
.month-records { overflow: hidden; }
.month-records.collapsed { display: none; }
.month-records .record-card:first-child { border-top-left-radius: 0; border-top-right-radius: 0; }

.detail-page { display: none; }
.detail-header { background: white; padding: 14px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
.detail-header-left { display: flex; align-items: center; gap: 12px; }
.back-btn { background: none; border: none; font-size: 15px; color: #1a7af8; cursor: pointer; padding: 4px 0; }
.detail-actions { display: flex; gap: 8px; }
.action-btn { padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid #ddd; background: white; color: #666; }
.action-btn.edit-btn { color: #1a7af8; border-color: #cce0ff; background: #f0f7ff; }
.action-btn.delete-btn { color: #e74c3c; border-color: #fad7d4; background: #fff5f5; }
.detail-items { padding: 8px 20px 16px; }
.detail-item { display: flex; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
.detail-item:last-child { border-bottom: none; }
.detail-item .label { color: #888; width: 90px; flex-shrink: 0; }
.detail-item .value { color: #222; word-break: break-all; flex: 1; }
.detail-item .value.highlight { color: #1a7af8; font-weight: 600; }
.detail-item .value.pending { color: #ff9800; }
.btn-row { padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
.copy-notice-btn { display: block; width: 100%; background: #f0f9e8; color: #27ae60; border: 1px solid #c0e0a0; border-radius: 10px; padding: 12px; font-size: 14px; cursor: pointer; text-align: center; }

/* Edit mode */
.edit-section { background: white; margin: 12px; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: none; }
.edit-section.show { display: block; }
.edit-section-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.edit-section-title .tag { background: #ff9500; color: white; font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: normal; }
.edit-form { padding-bottom: 8px; }
.edit-form .form-group { margin-bottom: 12px; }
.edit-form label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; }
.edit-form input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 9px 12px; font-size: 15px; outline: none; transition: border-color 0.2s; background: #fafafa; }
.edit-form input:focus { border-color: #1a7af8; background: white; }
.edit-form input:read-only { background: #f5f5f5; color: #888; }
.edit-btn-row { display: flex; gap: 10px; margin-top: 12px; }
.save-edit-btn { flex: 1; background: #1a7af8; color: white; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
.cancel-edit-btn { flex: 1; background: white; color: #666; border: 1px solid #ddd; border-radius: 10px; padding: 12px; font-size: 15px; cursor: pointer; }

/* Delete confirm overlay */
.confirm-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9998; display: none; align-items: center; justify-content: center; padding: 20px; }
.confirm-overlay.show { display: flex; }
.confirm-box { background: white; border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 320px; text-align: center; }
.confirm-icon { font-size: 40px; margin-bottom: 12px; }
.confirm-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.confirm-desc { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
.confirm-btn { display: block; width: 100%; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; margin-bottom: 10px; }
.confirm-btn.primary { background: #e74c3c; color: white; }
.confirm-btn.primary.step2 { background: #c0392b; }
.confirm-btn.secondary { background: white; color: #666; border: 1px solid #ddd; margin-bottom: 0; }
.confirm-btn.danger { background: #e74c3c; color: white; }

/* Form page */
.form-page { display: none; }
.form-header { background: white; padding: 14px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px; }
.form-section { background: white; margin: 12px; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.section-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.section-title .tag { background: #1a7af8; color: white; font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: normal; }
.paste-area { width: 100%; min-height: 120px; border: 2px dashed #ccc; border-radius: 10px; padding: 12px; font-size: 14px; color: #555; resize: none; outline: none; background: #fafafa; transition: border-color 0.2s; line-height: 1.6; }
.paste-area:focus { border-color: #1a7af8; background: white; }
.paste-area::placeholder { color: #bbb; }
.recognize-btn { display: block; width: 100%; background: #ff9500; color: white; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 12px; }
.recognize-btn:active { background: #e08600; }
.recognize-btn:disabled { background: #ccc; cursor: not-allowed; }
.recognize-result { background: #f0f9e8; border: 1px solid #c0e0a0; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #444; margin-top: 10px; line-height: 1.8; word-break: break-all; display: none; }
.recognize-result .unfilled { color: #ff6600; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
.addr-label { font-size: 13px; color: #666; margin-bottom: 6px; }
.field-label { font-size: 13px; color: #666; margin-bottom: 6px; }
.form-group input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; font-size: 15px; outline: none; transition: border-color 0.2s; background: #fafafa; }
.form-group input:focus { border-color: #1a7af8; background: white; }
.form-group input:read-only { background: #f5f5f5; color: #888; border-color: #e0e0e0; }
input[id^="f"] { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; font-size: 15px; outline: none; background: #fafafa; }
input[id^="f"]:focus { border-color: #1a7af8; background: white; }
input[id="fDate"] { border-color: #1a7af8; background: #f0f7ff; color: #1a7af8; font-weight: 600; }
input[id="fIdCard"] { background: #f5f5f5; color: #888; }
.goods-btns { display: flex; gap: 8px; }
.goods-btn { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 14px; cursor: pointer; text-align: center; transition: all 0.15s; color: #666; }
.goods-btn.active { background: #1a7af8; color: white; border-color: #1a7af8; font-weight: 600; }
.other-input-wrap { display: none; margin-top: 8px; }
.other-input-wrap.show { display: block; }
.other-input-wrap input { border-color: #ff9500; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.submit-btn { display: block; width: calc(100% - 24px); margin: 16px 12px; background: #1a7af8; color: white; border: none; border-radius: 12px; padding: 16px; font-size: 17px; font-weight: 600; cursor: pointer; }
.submit-btn:active { background: #1565d0; }
.submit-btn:disabled { background: #ccc; cursor: not-allowed; }

/* Toast */
.toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }
.toast.green { background: #27ae60; }
.toast.red { background: #e74c3c; }

.loading { text-align: center; padding: 40px; color: #aaa; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.record-card { animation: slideDown 0.2s ease; }
.edit-section { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-top: 15px; display: none; }
.edit-section.show { display: block; }
.edit-section .field-label { font-size: 12px; color: #888; margin: 8px 0 4px; }
.edit-section input, .edit-section select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 6px; }
.edit-section .two-col { display: flex; gap: 8px; }
.edit-section .two-col input { flex: 1; }
.edit-section .goods-btns { display: flex; gap: 6px; margin-bottom: 8px; }
.edit-section .goods-btn { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; text-align: center; font-size: 13px; cursor: pointer; background: white; }
.edit-section .goods-btn.active { background: #1a7af8; color: white; border-color: #1a7af8; }
.edit-section .save-btn { width: 100%; background: #1a7af8; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; margin-top: 10px; cursor: pointer; }
.edit-section .save-btn:disabled { background: #ccc; }
.edit-section .cancel-btn { width: 100%; background: #f0f0f0; color: #333; border: none; padding: 10px; border-radius: 8px; font-size: 14px; margin-top: 6px; cursor: pointer; }

/* 修改提示横条 */
.modify-banner { background: #fff3e0; border-left: 3px solid #e65100; padding: 8px 12px; margin: 10px 0; border-radius: 4px; font-size: 13px; color: #e65100; display: none; }
.modify-banner.show { display: block; }

/* 字段被修改后标红加粗 */
.detail-item .value.changed { color: #d32f2f; font-weight: 700; }
/* 版本号 */
.version-footer { text-align: center; padding: 20px; font-size: 12px; color: #999; margin-top: 10px; }
</style>
</head>
<body>

<div class="container">
  <!-- ===== 列表页 ===== -->
  <div class="list-page" id="listPage">
    <div class="header">
      <h1>🚛 装货登记</h1>
      <span class="count" id="recordCount">加载中...</span>
    </div>
    <div class="summary-bar" id="summaryBar" style="display:none"></div>
    <div class="filter-bar">
      <div class="filter-row">
        <input type="date" id="filterStart" onchange="applyFilter()">
        <span class="filter-sep">至</span>
        <input type="date" id="filterEnd" onchange="applyFilter()">
      </div>
      <div class="filter-row">
        <input type="text" id="filterKeyword" placeholder="搜车牌/姓名/地点" oninput="applyFilter()">
        <button class="filter-btn-reset" onclick="resetFilter()">重置</button>
        <button class="filter-btn-export" onclick="exportCSV()">导出</button>
      </div>
      <div class="filter-row">
        <div class="location-selector">
          <button class="loc-btn active" id="locAll" onclick="setLocationFilter('all')">全部</button>
          <button class="loc-btn" id="locFrom" onclick="setLocationFilter('from')">装货地</button>
          <button class="loc-btn" id="locTo" onclick="setLocationFilter('to')">收货地</button>
        </div>
        <button class="filter-btn-import" onclick="document.getElementById('importFile').click()">📥 导入历史</button>
        <button class="filter-btn-template" onclick="downloadTemplate()">📄 下载模板</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".csv" style="display:none" onchange="handleImportFile(event)">
    <button class="add-btn" onclick="showForm()">+ 新增登记</button>
    <div id="recordList"><div class="loading">连接数据库...</div></div>
  </div>

  <!-- ===== 详情页 ===== -->
  <div class="detail-page" id="detailPage">
    <div class="detail-header">
      <div class="detail-header-left">
        <button class="back-btn" onclick="showList()">← 返回</button>
        <span style="font-weight:600">记录详情</span>
      </div>
      <div class="detail-actions">
        <button class="action-btn edit-btn" onclick="openFullEdit()">📝 修改</button>
        <button class="action-btn edit-btn" id="editToggleBtn" onclick="toggleEdit()">✏️ 补填</button>
        <button class="action-btn delete-btn" onclick="confirmDelete()">🗑️ 删除</button>
      </div>
    </div>
    <div class="detail-items" id="detailItems"></div>
    <div class="btn-row">
      <button class="copy-notice-btn" id="detailCopyBtn" onclick="copyDetailNotice()">📋 复制通知文字</button>
    </div>

    <!-- 补填编辑区 -->
    <div class="edit-section" id="editSection">
      <div class="edit-section-title">✏️ 补填 / 修改 <span class="tag">仅可修改过磅信息</span></div>
      <div class="edit-form">
        <div class="two-col">
          <div class="form-group">
            <label>过磅重量(公斤)</label>
            <input type="number" id="eWeight" placeholder="如:20000">
          </div>
          <div class="form-group">
            <label>过磅费(元)</label>
            <input type="number" id="eWeighFee" placeholder="如:50">
          </div>
        </div>
        <div class="edit-btn-row">
          <button class="save-edit-btn" onclick="saveEdit()">保存修改</button>
          <button class="cancel-edit-btn" onclick="toggleEdit()">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 登记表单页 ===== -->
  <div class="form-page" id="formPage">
    <div class="form-header">
      <button class="back-btn" onclick="showList()">← 返回</button>
      <span style="font-weight:600">新增登记</span>
    </div>

    <div class="form-section">
      <div class="section-title">📋 粘贴识别区 <span class="tag">自动填入</span></div>
      <textarea class="paste-area" id="pasteArea" placeholder="把司机发来的信息整段粘贴到这里..." oninput="checkPaste()"></textarea>
      <button class="recognize-btn" id="recognizeBtn" onclick="doRecognize()" disabled>🔍 识别</button>
      <div class="recognize-result" id="recognizeResult"></div>
    </div>

    <div class="form-section">
      <div class="section-title">📝 核对与补填</div>

      <div class="form-group" style="margin-bottom:10px">
        <input type="date" id="fDate" style="text-align:center;font-size:15px;padding:10px">
      </div>

      <div class="field-label">车牌号码</div>
      <div class="two-col" style="margin-bottom:10px">
        <input type="text" id="fPlateMain" placeholder="主车:粤******">
        <input type="text" id="fPlateTrailer" placeholder="挂车:粤****挂">
      </div>

      <div class="field-label">司机姓名</div>
      <div class="two-col" style="margin-bottom:10px">
        <input type="text" id="fName" placeholder="姓名:未输入">
        <input type="tel" id="fPhone" placeholder="手机:188****8888">
      </div>

      <div class="addr-label">装货地 ----- 收货地</div>
      <div class="two-col" style="margin-bottom:10px">
        <input type="text" id="fFrom" placeholder="装货地:">
        <input type="text" id="fTo" placeholder="收货地:">
      </div>

      <div class="form-group" style="margin-bottom:10px">
        <div class="goods-btns">
          <div class="goods-btn" onclick="selectGoods(this, '盘扣')">盘扣</div>
          <div class="goods-btn" onclick="selectGoods(this, '套扣')">套扣</div>
          <div class="goods-btn" onclick="selectGoods(this, '其他')">其他</div>
        </div>
        <div class="other-input-wrap" id="otherWrap">
          <input type="text" id="fGoodsOther" placeholder="请输入货物名称">
        </div>
      </div>

      <div class="field-label">运输费(元)</div>
      <div class="two-col" style="margin-bottom:10px">
        <input type="number" id="fFreight" placeholder="运费(元)">
        <input type="number" id="fWeighFee" placeholder="过磅费(元)">
      </div>

      <div style="display:flex;align-items:center;gap:6px;margin-bottom:0">
        <input type="number" id="fWeight" placeholder="过磅(公斤)" style="flex:1" oninput="updateTon()">
        <span id="tonDisplay" style="font-size:16px;color:#333;white-space:nowrap;font-weight:500"></span>
      </div>
      <input type="text" id="fIdCard" readonly style="display:none">
    </div>

    <button class="submit-btn" id="submitBtn" onclick="doSubmit()">提 交</button>
  </div>
</div>

<!-- ===== 完整修改弹窗 ===== -->
<div class="confirm-overlay" id="fullEditModal">
  <div class="confirm-box" style="max-width:90%; width:500px; max-height:90vh; overflow-y:auto; text-align:left">
    <div class="confirm-title">📝 修改记录</div>
    <div id="fullEditForm">
      <div class="field-label">日期</div>
      <input type="date" id="mDate">
      <div class="field-label">车牌号码</div>
      <div class="two-col">
        <input type="text" id="mPlateMain" placeholder="主车">
        <input type="text" id="mPlateTrailer" placeholder="挂车">
      </div>
      <div class="field-label">司机信息</div>
      <div class="two-col">
        <input type="text" id="mName" placeholder="姓名">
        <input type="tel" id="mPhone" placeholder="手机号">
      </div>
      <input type="text" id="mIdCard" placeholder="身份证号">
      <div class="field-label">装货地 - 收货地</div>
      <div class="two-col">
        <input type="text" id="mFrom" placeholder="装货地">
        <input type="text" id="mTo" placeholder="收货地">
      </div>
      <div class="field-label">货物</div>
      <div class="goods-btns">
        <div class="goods-btn" onclick="selectModalGoods(this, '盘扣')">盘扣</div>

<script>
// Supabase 配置
const SUPABASE_URL = 'https://gdyiottosunwjothghaz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OMPVS-R2K3r9o8vx0VCx1A_SAd4iomg';
const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentRecords = [];
let filterStartDate = '';
let collapsedMonths = {}; // { '2026-08': true }
let filterEndDate = '';
let filterKeyword = '';
let locationFilter = 'all'; // 'all' | 'from' | 'to'
let currentDetail = null;
let selectedGoods = '';
let deleteStep = 0; // 0=未确认 1=第一步确认 2=第二步确认

// 页面切换
function showList() {
  document.getElementById('listPage').style.display = 'block';
  document.getElementById('detailPage').style.display = 'none';

function resetForm() {
  document.getElementById('pasteArea').value = '';
  document.getElementById('recognizeResult').style.display = 'none';
  document.getElementById('recognizeBtn').disabled = true;
  const today = new Date();
  document.getElementById('fDate').value = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  ['fPlateMain','fPlateTrailer','fName','fPhone','fIdCard','fFrom','fTo','fFreight','fWeight','fWeighFee'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fIdCard').readOnly = true;
  document.querySelectorAll('.goods-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('otherWrap').classList.remove('show');

  selectedGoods = '';
}

function checkPaste() {
  const text = document.getElementById('pasteArea').value.trim();
  document.getElementById('recognizeBtn').disabled = text.length < 5;
}

// 智能识别
function recognize(rawText) {
  const text = rawText.replace(/\r\n/g, '\n').trim();
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const provinceRe = '[京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉贵粤青藏川宁琼台港澳闽]';
  const plateOneRe = provinceRe + '[A-Z][A-Z0-9]{4,6}';
  let result = { date: formatDate(new Date()), plateMain: '', plateTrailer: '', name: '', phone: '', idCard: '', from: '', to: '', goods: '', goodsRaw: '', freight: '' };

  const allText = text;

  // 日期
  for (const line of lines) {
    const m = line.match(/^(\d{1,2})[月\-\.](\d{1,2})/);
    if (m) { const y = new Date().getFullYear(); result.date = y + '-' + m[1].padStart(2,'0') + '-' + m[2].padStart(2,'0'); break; }
    const m2 = line.match(/^(\d{4})[年\-\.](\d{1,2})[月\-\.](\d{1,2})/);
    if (m2) { result.date = m2[1] + '-' + m2[2].padStart(2,'0') + '-' + m2[3].padStart(2,'0'); break; }
  }

  // 身份证
  const idWithLabel = allText.match(/身份证[::\s]*([1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dx])/i);
  if (idWithLabel) result.idCard = idWithLabel[1].toUpperCase();
  else { const idAll = allText.match(/([1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dx])/i); if (idAll) result.idCard = idAll[1].toUpperCase(); }

  // 手机号
  const phoneWithLabel = allText.match(/电话[::\s]*(\d{11})/);
  if (phoneWithLabel) result.phone = phoneWithLabel[1];
  else {
    const phoneAll = allText.match(/(?:^|[^\d])(\d{11})(?=[^\d]|$)/);
    if (phoneAll) result.phone = phoneAll[1];
  }

  // 货物
  for (const line of lines) {
    if (line.includes('盘扣')) { result.goods = '盘扣'; break; }
    if (line.includes('套扣')) { result.goods = '套扣'; break; }
    if (/^其他[\s\d\u4e00-\u9fa5]/.test(line)) { result.goods = line.replace(/^其他/, '').trim() || '其他'; result.goodsRaw = '其他'; break; }
  }
  if (!result.goods) {
    const goodsLine = lines.find(l => l.includes('盘扣') || l.includes('套扣'));
    if (goodsLine) { if (goodsLine.includes('盘扣')) result.goods = '盘扣'; else if (goodsLine.includes('套扣')) result.goods = '套扣'; }
  }

  // 姓名(多种模式)
  const excludeNames = ['盘扣','套扣','其他','平板车','牵引车','货车','地址','盘扣车辆','套扣车辆'];
  // 1. 标签式:姓名:xxx / 司机:xxx / 司机:xxx / 司机,xxx / 司机 xxx
  const nameWithLabel = allText.match(/(?:姓名|司机)[：：，:\s]*([^\d\s，,、。：:货地址]{2,4})/);
  if (nameWithLabel && !excludeNames.includes(nameWithLabel[1])) result.name = nameWithLabel[1].trim();
  // 2. 单行混排:xxx,姓名,身份证
  if (!result.name) {
    const m = allText.match(/[，,]\s*([\u4e00-\u9fa5]{2,4})\s*[，,]\s*身份证/);
    if (m && !excludeNames.includes(m[1])) result.name = m[1];
  }
  // 3. 单行混排:身份证前接姓名
  if (!result.name && result.idCard) {
    const idPos = allText.indexOf(result.idCard);
    if (idPos > 0) {
      const beforeId = allText.substring(Math.max(0, idPos - 20), idPos);
      const m = beforeId.match(/([\u4e00-\u9fa5]{2,4})[，,]\s*$/);
      if (m && !excludeNames.includes(m[1])) result.name = m[1];
    }
  }
  // 4. 独立行
  if (!result.name) {
    for (const l of lines) {
      if (/^[\u4e00-\u9fa5]{2,4}$/.test(l) && !excludeNames.includes(l)) {
        result.name = l;
        break;
      }
    }
  }

  // 运费
  const freightWithLabel = allText.match(/运费[::\s]*(\d+)/);
  if (freightWithLabel) result.freight = freightWithLabel[1];
  else {
    const freightNear = allText.match(/运费[\u4e00-\u9fa5]*(\d+)/);
    if (freightNear) result.freight = freightNear[1];
    else {
      const m = allText.match(/实付[\u4e00-\u9fa5]*(\d+)/);
      if (m) result.freight = m[1];
    }
  }

  // 车牌(多种模式)
  // 1. 标签+双车牌:车牌:粤Kxxx+粤Kyyyy挂 / 车牌:粤Kxxx 粤Kyyyy挂
  let m = allText.match(new RegExp('车牌[:,\\s]*(' + plateOneRe + ')\\s*[+ \\t]\\s*(' + plateOneRe + ')\\s*挂'));
  if (m) { result.plateMain = m[1]; result.plateTrailer = m[2] + '挂'; }
  // 2. 标签+单车牌:车牌:粤Kxxx / 车号粤Kxxx(标签后任意标点/空格)
  if (!result.plateMain) {
    m = allText.match(new RegExp('车牌[::\\s,]*(' + plateOneRe + ')'));
    if (m) result.plateMain = m[1];
    else {
      m = allText.match(new RegExp('车号[::\\s]*(' + plateOneRe + ')'));
      if (m) result.plateMain = m[1];
    }
  }
  // 3. 挂车标签(处理空格,如「挂车号皖 L1B70挂」)
  if (!result.plateTrailer) {
    m = allText.match(new RegExp('(?:挂车|挂车号)[：:\\s,]*(' + provinceRe + ')\\s*([A-Z][A-Z0-9]{4,6})\\s*挂'));
    if (m) result.plateTrailer = m[1] + m[2] + '挂';
  }
  // 4. 通用提取:所有车牌及挂车
  if (!result.plateMain || !result.plateTrailer) {
    const allPlates = [];
    const plateRegex = new RegExp(plateOneRe + '挂?', 'g');
    let pm;
    while ((pm = plateRegex.exec(allText)) !== null) {
      allPlates.push({ text: pm[0], pos: pm.index });
    }
    const trailers = allPlates.filter(p => p.text.endsWith('挂'));
    const mains = allPlates.filter(p => !p.text.endsWith('挂'));
    if (!result.plateMain && mains.length > 0) result.plateMain = mains[0].text;
    if (!result.plateTrailer) {
      if (trailers.length > 0) result.plateTrailer = trailers[0].text;
      else if (mains.length >= 2) result.plateTrailer = mains[1].text;
    }
  }
  // 5. 单行混排兜底
  if (!result.plateMain && result.idCard) {
    const idPos = allText.indexOf(result.idCard);
    if (idPos > 0) {
      const beforeId = allText.substring(0, idPos);
      const plates = beforeId.match(new RegExp(plateOneRe, 'g'));
      if (plates && plates.length > 0) {
        result.plateMain = plates[0];
        if (plates.length >= 2) result.plateTrailer = plates[1] + (plates[1].endsWith('挂') ? '' : '');
      }
    }
  }

  // 修复挂车"挂"字
  if (result.plateTrailer && !result.plateTrailer.endsWith('挂')) {
    result.plateTrailer = result.plateTrailer + '挂';
  }

  // 地址
  const singleLine = lines.find(l => /退回|送至|→/.test(l));
  if (singleLine) { const parts = singleLine.split(/退回|送至|→/).map(s => s.trim()); if (parts.length >= 2) { result.from = parts[0]; result.to = parts[1]; } else if (parts.length === 1) result.to = parts[0]; }
  if (!result.from || !result.to) { for (const line of lines) { if (/退回|送至|→/.test(line) && line.length > 3 && line.length < 50) { const parts = line.split(/退回|送至|→/).map(s => s.trim()); if (!result.from && parts[0]) result.from = parts[0]; if (!result.to && parts[1]) result.to = parts[1]; if (result.from && result.to) break; } } }
  if (!result.from || !result.to) { const fullLine = allText.match(/([\u4e00-\u9fa5]{2,20})(?:退回|送至|→)([\u4e00-\u9fa5]{2,20})/); if (fullLine) { result.from = result.from || fullLine[1]; result.to = result.to || fullLine[2]; } }

  // 过磅重量
  const weightWithLabel = allText.match(/(?:过磅|磅单|重量)[^\d]*(\d+)/);
  if (weightWithLabel) result.weight = weightWithLabel[1];
  else { const w = allText.match(/(?:公斤|kg|KG)[^\d]*(\d+)/); if (w) result.weight = w[1]; }

  return result;
}

function updateTon() {
  const v = document.getElementById('fWeight').value;
  const el = document.getElementById('tonDisplay');
  if (!v || isNaN(v) || Number(v) <= 0) { el.textContent = ''; return; }
  const t = (Number(v) / 1000).toFixed(2);
  el.textContent = ' = ' + t + ' 吨';
}

function doRecognize() {
  const text = document.getElementById('pasteArea').value;
  if (!text.trim()) return;
  const r = recognize(text);
  document.getElementById('fDate').value = r.date;
  if (r.date) {
    const d = new Date(r.date);
    document.getElementById('fDate').style.color = '#1a7af8';
  }
  document.getElementById('fPlateMain').value = r.plateMain;
  document.getElementById('fPlateTrailer').value = r.plateTrailer;
  document.getElementById('fName').value = r.name;
  document.getElementById('fPhone').value = r.phone;
  document.getElementById('fIdCard').value = r.idCard;
  document.getElementById('fFrom').value = r.from;
  document.getElementById('fTo').value = r.to;
  document.getElementById('fFreight').value = r.freight;
  document.getElementById('fWeight').value = r.weight || '';
  if (r.weight) updateTon();
  document.querySelectorAll('.goods-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('otherWrap').classList.remove('show');
  selectedGoods = '';
  if (r.goods === '盘扣' || r.goods === '套扣') { document.querySelectorAll('.goods-btn').forEach(b => { if (b.textContent.trim() === r.goods) b.classList.add('active'); }); selectedGoods = r.goods; }
  else if (r.goods && r.goods !== '其他') { selectedGoods = r.goodsRaw || '其他'; document.querySelectorAll('.goods-btn').forEach(b => { if (b.textContent.trim() === '其他') b.classList.add('active'); }); document.getElementById('otherWrap').classList.add('show'); document.getElementById('fGoodsOther').value = r.goods; }
  const resultEl = document.getElementById('recognizeResult');
  const unfilled = [], filled = [];
  const push = (label, val) => val ? filled.push(label + ' ' + val) : unfilled.push(label);
  push('日期', r.date); push('主车', r.plateMain); push('挂车', r.plateTrailer); push('姓名', r.name); push('手机', r.phone); push('身份证', r.idCard); push('运费', r.freight ? r.freight + '元' : ''); push('装货地', r.from); push('收货地', r.to); push('货物', r.goods);
  resultEl.innerHTML = '<strong>已识别:</strong>' + filled.join(' | ') + (unfilled.length ? '<br><span class="unfilled">未识别:' + unfilled.join('、') + '(请手动填写)</span>' : '');
  resultEl.style.display = 'block';
  toast('识别完成,请核对后提交', true);
}

function selectGoods(el, type) {
  document.querySelectorAll('.goods-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedGoods = type;
  const wrap = document.getElementById('otherWrap');
  if (type === '其他') { wrap.classList.add('show'); document.getElementById('fGoodsOther').focus(); }
  else { wrap.classList.remove('show'); document.getElementById('fGoodsOther').value = ''; }
}

async function doSubmit() {
  const plate = document.getElementById('fPlateMain').value.trim();
  const from = document.getElementById('fFrom').value.trim();
  if (!plate) { toast('请填写主车车牌'); return; }
  const goodsDisplay = selectedGoods === '其他' ? (document.getElementById('fGoodsOther').value.trim() || '其他') : (selectedGoods || '待填');
  const r = {
    date: document.getElementById('fDate').value || formatDate(new Date()),
    plateMain: plate,
    plateTrailer: document.getElementById('fPlateTrailer').value.trim(),
    name: document.getElementById('fName').value.trim(),
    phone: document.getElementById('fPhone').value.trim(),
    idCard: document.getElementById('fIdCard').value.trim(),
    from: from,
    to: document.getElementById('fTo').value.trim(),
    goods: goodsDisplay,
    freight: document.getElementById('fFreight').value.trim(),
    weight: document.getElementById('fWeight').value.trim(),
    weighFee: document.getElementById('fWeighFee').value.trim()
  };
  const record = {
    date: r.date, plate_main: r.plateMain, plate_trailer: r.plateTrailer,
    name: r.name, phone: r.phone, id_card: r.idCard,
    from_location: r.from, to_location: r.to, goods: r.goods,
    freight: r.freight, weight: r.weight, weigh_fee: r.weighFee,
    notice: generateNotice(r)
  };
  const { error } = await supabaseClient.from('records').insert([record]);
  if (error) { toast('提交失败:' + error.message, false, true); return; }
  toast('已登记 ✓', true);
  setTimeout(() => { loadRecords(); showList(); }, 600);
}

function generateNotice(r) {
  const plateStr = r.plateTrailer ? r.plateMain + '+' + r.plateTrailer : r.plateMain;
  const nameStr = r.name ? ' | 姓名:' + r.name : '';
  const phoneStr = r.phone ? ' | 手机:' + r.phone : '';
  const weightStr = r.weight ? r.weight + '公斤' : '待填';
  const feeStr = r.weighFee ? r.weighFee + '元' : '待填';
  const route = r.from && r.to ? '装:' + r.from + ' → 收:' + r.to : (r.from ? '装货地:' + r.from : (r.to ? '收货地:' + r.to : ''));
  return '🚛 已登记 | ' + r.date + ' | 车牌:' + plateStr + nameStr + phoneStr + ' | ' + route + ' | 货物:' + r.goods + ' | 运费:' + r.freight + '元 | 过磅:' + weightStr + ' | 过磅费:' + feeStr;
}

async function loadRecords() {
  const { data, error } = await supabaseClient.from('records').select('*').order('created_at', { ascending: false });
  if (error) { document.getElementById('recordList').innerHTML = '<div class="empty"><div class="empty-icon">❌</div>连接失败,请刷新</div>'; return; }
  currentRecords = data || [];
  renderList();
}

function getFilteredRecords() {
  let list = currentRecords;
  if (filterStartDate) list = list.filter(r => (r.date || '') >= filterStartDate);
  if (filterEndDate) list = list.filter(r => (r.date || '') <= filterEndDate);
  if (filterKeyword) {
    const kw = filterKeyword.toLowerCase();
    list = list.filter(r =>
      (r.plate_main && r.plate_main.toLowerCase().includes(kw)) ||
      (r.plate_trailer && r.plate_trailer.toLowerCase().includes(kw)) ||
      (r.name && r.name.toLowerCase().includes(kw)) ||
      (r.from_location && r.from_location.toLowerCase().includes(kw)) ||
      (r.to_location && r.to_location.toLowerCase().includes(kw))
    );
  }
  if (locationFilter !== 'all') {
    if (locationFilter === 'from') list = list.filter(r => r.from_location && r.from_location.trim());
    if (locationFilter === 'to') list = list.filter(r => r.to_location && r.to_location.trim());
  }
  return list;
}

function renderList() {
  const display = getFilteredRecords();
  document.getElementById('recordCount').textContent = display.length + ' 条';
  // 计算汇总
  const totalFreight = display.reduce((sum, r) => sum + (parseFloat(r.freight) || 0), 0);
  const totalPaid = display.reduce((sum, r) => sum + ((r.is_paid === true) ? (parseFloat(r.freight) || 0) : 0), 0);
  const totalWeighFee = display.reduce((sum, r) => sum + (parseFloat(r.weigh_fee) || 0), 0);
  const summaryEl = document.getElementById('summaryBar');
  if (summaryEl) {
    summaryEl.innerHTML = '已支付/运费合计:' + totalPaid.toFixed(0) + '/' + totalFreight.toFixed(0) + '元 | 过磅费合计:' + totalWeighFee.toFixed(0) + '元';
    summaryEl.style.display = display.length > 0 ? 'block' : 'none';
  }
  const el = document.getElementById('recordList');
  if (currentRecords.length === 0) { el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>还没有登记记录<br>点上方按钮开始</div>'; return; }
  if (display.length === 0) { el.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>没有符合条件的记录<br>试试调整筛选条件</div>'; return; }
  // 按年月分组（YYYY-MM）
  const groups = {};
  display.forEach(r => {
    const ym = (r.date || '').substring(0, 7);
    if (!groups[ym]) groups[ym] = [];
    groups[ym].push(r);
  });
  const sortedKeys = Object.keys(groups).sort().reverse(); // 最新月在先
  const cardHtml = r => {
    const plate = r.plate_trailer ? r.plate_main + '+' + r.plate_trailer : r.plate_main;
    const hasWeight = r.weight && r.weight.trim();
    const hasWeighFee = r.weigh_fee && r.weigh_fee.trim();
    const badges = [];
    if (!hasWeight) badges.push('<span class="badge-pending">待补重量</span>');
    if (!hasWeighFee) badges.push('<span class="badge-pending">待补过磅费</span>');
    if ((r.modified_count || 0) > 0) badges.push('<span class="badge-modified">已修改</span>');
    const badgeStr = badges.join('');
    const goods = r.goods || '待填';
    const freightStr = r.freight ? '运费:' + r.freight + '元' : '';

function exportCSV() {
  const list = getFilteredRecords();
  if (list.length === 0) { toast('没有可导出的记录', false, true); return; }
  const headers = ['日期','主车','挂车','姓名','手机号','身份证号','装货地','收货地','货物','运费','过磅费','过磅重量','已支付','修改次数'];
  const rows = list.map(r => [
    r.date || '', r.plate_main || '', r.plate_trailer || '', r.name || '', r.phone || '',
    r.id_card || '', r.from_location || '', r.to_location || '', r.goods || '', r.freight || '',
    r.weigh_fee || '', r.weight || '', (r.is_paid === true) ? '是' : '否', r.modified_count || 0
  ]);
  let csv = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(row => {
    csv += row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '装货登记_' + formatDate(new Date()) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已导出 ' + list.length + ' 条记录', true);
}

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; } else { inQ = false; }
      } else { field += c; }
    } else {
      if (c === '"') { inQ = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else { field += c; }
    }
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

async function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const rows = parseCSV(ev.target.result);
      if (rows.length < 2) { toast('文件没有数据行', false, true); e.target.value = ''; return; }
      const header = rows[0].map(h => h.trim());
      const idx = {};
      header.forEach((h, i) => idx[h] = i);
      const get = (name, r) => (idx[name] !== undefined && r[idx[name]] != null) ? String(r[idx[name]]).trim() : '';
      const records = [];
      let skipped = 0;
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const date = get('日期', r);
        const plate = get('主车', r);
        if (!date || !plate) { skipped++; continue; }
        const isPaidRaw = get('已支付', r);
        const isPaid = (isPaidRaw === '是' || isPaidRaw === 'true' || isPaidRaw === '1');
        const mc = parseInt(get('修改次数', r)) || 0;
        const rec = {
          date: date,
          plate_main: plate,
          plate_trailer: get('挂车', r) || null,
          name: get('姓名', r) || null,
          phone: get('手机号', r) || null,
          id_card: get('身份证号', r) || null,
          from_location: get('装货地', r) || null,
          to_location: get('收货地', r) || null,
          goods: get('货物', r) || null,
          freight: get('运费', r) || null,
          weigh_fee: get('过磅费', r) || null,
          weight: get('过磅重量', r) || null,
          is_paid: isPaid,
          modified_fields: '[]',
          modified_count: mc
        };
        const camel = { date: rec.date, plateMain: rec.plate_main, plateTrailer: rec.plate_trailer, name: rec.name, phone: rec.phone, weight: rec.weight, weighFee: rec.weigh_fee, from: rec.from_location, to: rec.to_location, goods: rec.goods, freight: rec.freight };
        rec.notice = generateNotice(camel);
        records.push(rec);
      }
      if (records.length === 0) { toast('没有可导入的有效记录（需有日期和主车）', false, true); e.target.value = ''; return; }
      toast('正在导入 ' + records.length + ' 条...', true);
      const BATCH = 100;
      for (let i = 0; i < records.length; i += BATCH) {
        const batch = records.slice(i, i + BATCH);
        const { error } = await supabaseClient.from('records').insert(batch);
        if (error) { toast('导入失败:' + error.message, false, true); e.target.value = ''; return; }
      }
      toast('成功导入 ' + records.length + ' 条' + (skipped ? '（跳过 ' + skipped + ' 行空数据）' : ''), true);
      loadRecords();
    } catch (err) {
      toast('导入出错:' + err.message, false, true);
    }
    e.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

async function togglePaid(id, newPaid) {
  // 如果是取消勾选（newPaid=false），需要两步确认
  if (newPaid === false) {
    if (cancelPaidStep === 0 || cancelPaidId !== id) {
      // 第一步确认
      cancelPaidStep = 1;
      cancelPaidId = id;
      cancelPaidNewValue = newPaid;
      showCancelPaidConfirm(id);
      return;
    }
  }
  
  // 执行更新
  try {
    const { error } = await supabaseClient.from('records').update({ is_paid: newPaid }).eq('id', id);
    if (error) {
      if (error.message && error.message.includes('is_paid')) {
        toast('支付功能暂不可用，请联系管理员', false, true);
        return;
      }
      toast('更新失败:' + error.message, false, true);
      return;
    }
    cancelPaidStep = 0;
    cancelPaidId = null;
    hideCancelPaidConfirm();
    loadRecords();
  } catch (e) {
    toast('更新失败，请刷新页面重试', false, true);

}

async function saveFullEdit() {

  const activeGoods = document.querySelector('#fullEditModal .goods-btn.active');
  let goods = activeGoods ? activeGoods.textContent.trim() : '';
  if (goods === '其他') {
    const other = document.getElementById('mGoodsOther').value.trim();
    goods = other || '其他';
  }
  const newData = {
    date: document.getElementById('mDate').value,
    plate_main: document.getElementById('mPlateMain').value.trim(),
    plate_trailer: document.getElementById('mPlateTrailer').value.trim(),
    name: document.getElementById('mName').value.trim(),
    phone: document.getElementById('mPhone').value.trim(),
    id_card: document.getElementById('mIdCard').value.trim(),
    from_location: document.getElementById('mFrom').value.trim(),
    to_location: document.getElementById('mTo').value.trim(),
    goods: goods,
    freight: document.getElementById('mFreight').value.trim(),
    weigh_fee: document.getElementById('mWeighFee').value.trim(),
    weight: document.getElementById('mWeight').value.trim()
  };
  // 找被修改的字段
  const changedFields = [];
  const fieldLabels = {
    date: '日期', plate_main: '主车车牌', plate_trailer: '挂车车牌',
    name: '姓名', phone: '手机号', from_location: '装货地',
    to_location: '收货地', goods: '货物', freight: '运费',
    weigh_fee: '过磅费', weight: '过磅重量'
  };
  Object.keys(fieldLabels).forEach(k => {
    const oldVal = (modalEditOriginal[k] || '').toString().trim();
    const newVal = (newData[k] || '').toString().trim();
    if (oldVal !== newVal) {
      changedFields.push({ key: k, label: fieldLabels[k], oldVal, newVal });
    }
  });
  // 同步更新通知文字
  newData.notice = generateNotice({
    date: newData.date, plateMain: newData.plate_main, plateTrailer: newData.plate_trailer,
    name: newData.name, phone: newData.phone, idCard: newData.id_card,
    from: newData.from_location, to: newData.to_location, goods: newData.goods,
    freight: newData.freight, weight: newData.weight, weighFee: newData.weigh_fee
  });
  // 记录修改历史
  const existingModified = currentDetail.modified_fields || [];
  const newModifiedKeys = changedFields.map(f => f.key);
  const allModified = [...new Set([...existingModified, ...newModifiedKeys])];
  newData.modified_fields = allModified;
  newData.modified_count = (currentDetail.modified_count || 0) + changedFields.length;
  const { error } = await supabaseClient.from('records').update(newData).eq('id', currentDetail.id);
  if (error) { toast('保存失败:' + error.message, false, true); return; }
  // 刷新当前记录
  const { data } = await supabaseClient.from('records').select('*').eq('id', currentDetail.id).single();
  if (data) {
    currentDetail = data;
    renderDetailWithChanges(data, changedFields);
  }
  closeFullEdit();
  loadRecords();
  // 顶部提示
  if (changedFields.length > 0) {
    const msg = '已修改 ' + changedFields.length + ' 项:' + changedFields.map(f => f.label).join('、');
    showModifyBanner(msg, changedFields);
  } else {
    toast('未修改任何字段', true);
  }
}

function showModifyBanner(msg, changedFields) {
  const banner = document.getElementById('modifyBanner');

function parseModifiedFields(r) {
  // 数据库 modified_fields 可能是 JSON 字符串或数组
  const mf = r.modified_fields;
  if (!mf) return [];
  if (Array.isArray(mf)) return mf;
  try { return JSON.parse(mf); } catch(e) { return []; }
}
function renderDetailWithChanges(r, changedFields) {
  // 合并本次修改和数据库已记录的修改
  const dbModified = parseModifiedFields(r);
  const currentChanged = changedFields.map(f => f.key);
  const allChanged = [...new Set([...dbModified, ...currentChanged])];
  renderDetail(r, allChanged);
}
function renderDetailChanged(r) {
  // 使用数据库记录的修改字段永久标红
  renderDetail(r, parseModifiedFields(r));
}

  const { error } = await supabaseClient.from('records').delete().eq('id', currentDetail.id);
  if (error) { toast('删除失败:' + error.message, false, true); return; }
  toast('已删除', true);
  setTimeout(() => showList(), 600);
}

function hideDeleteConfirm() {
  document.getElementById('deleteConfirm').classList.remove('show');
  deleteStep = 0;
}

function copyDetailNotice() {
  if (!currentDetail) return;
  const r = {
    date: currentDetail.date, plateMain: currentDetail.plate_main, plateTrailer: currentDetail.plate_trailer,
    name: currentDetail.name, phone: currentDetail.phone, idCard: currentDetail.id_card,
    from: currentDetail.from_location, to: currentDetail.to_location, goods: currentDetail.goods,
    freight: currentDetail.freight, weight: currentDetail.weight, weighFee: currentDetail.weigh_fee
  };
  const text = currentDetail.notice || generateNotice(r);
  copyText(text);
}

function copyText(text) {
  if (navigator.clipboard) { navigator.clipboard.writeText(text).then(() => toast('已复制,去微信群粘贴发送', true)); }
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('已复制,去微信群粘贴发送', true); }
}

function formatDate(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function formatDateCN(dateStr) {
  if (!dateStr) return '';
  const m = dateStr.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return dateStr;
  return m[1] + '年' + parseInt(m[2]) + '月' + parseInt(m[3]) + '日';
}

function toast(msg, green, red) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (green ? ' green' : '') + (red ? ' red' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
